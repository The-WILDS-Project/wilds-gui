[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wilds-gui"
version = "0.1.0"
description = "WILDS web GUI (Django): the Telescope Operator's page (/to) and the Instrument Operator's GUI (/io)"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wilds"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["wilds"]
