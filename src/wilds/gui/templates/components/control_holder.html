{# "WILDS control: held by X" on every page (plan §3.11). #}
<div x-data class="d-flex align-items-center gap-2">
    <i class="bi bi-person-badge"></i>
    <span x-show="!$store.wilds.control.holder">WILDS control: <em>nobody</em></span>
    <span x-show="$store.wilds.control.holder && !$store.wilds.control.engineering">
        WILDS control: <strong x-text="$store.wilds.control.holder"></strong>
    </span>
    <span x-show="$store.wilds.control.engineering" class="badge ui-warning">
        engineering mode: <span x-text="$store.wilds.control.holder"></span>
    </span>
</div>
