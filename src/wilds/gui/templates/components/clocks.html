{% comment %} Server time in LDT and UT, and (operator and engineering pages) this browser's own LT.
   The server's clock comes in the status stream; clock.js keeps it ticking.
{% endcomment %}
<div x-data class="ui-clocks" :class="{ stale: !$store.clock.live }"
     x-tooltip="$store.clock.tip">
    <div><strong class="ui-clock-label">LDT</strong> <span x-text="$store.clock.ldt"></span></div>
    <div><strong class="ui-clock-label">UT</strong> <span x-text="$store.clock.ut"></span></div>
    {% if show_lt %}<div><strong class="ui-clock-label">LT</strong> <span x-text="$store.clock.lt"></span></div>{% endif %}
</div>
