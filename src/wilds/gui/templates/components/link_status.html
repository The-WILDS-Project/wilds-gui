{# Link to the server, i.e. wilds-control (MAST components/controller_status.html, fed by the status stream). #}
<div class="dropdown" x-data>
    <button class="badge ui-pill dropdown-toggle border-0" :class="$store.wilds.serverView.cls" type="button"
            data-bs-toggle="dropdown" aria-expanded="false">
        <i class="bi bi-hdd-network"></i>
        <span class="pill-label">Server:</span>
        <span class="pill-value" x-text="$store.wilds.serverView.text"></span>
    </button>
    <div class="dropdown-menu dropdown-menu-end p-3" style="min-width: 300px;">
        <h6 class="dropdown-header px-0">Server</h6>
        <div class="small text-body-secondary">{{ wilds_control_url }}</div>
        <div class="small mt-2">
            Last update:
            <span x-text="$store.wilds.lastUpdate ? $store.wilds.lastUpdate.toLocaleTimeString() : 'never'"></span>
        </div>
    </div>
</div>
